<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Letter</title>

  <style>
    body {
      margin: 0;
      font-family: "Courier New", monospace;
      background: #ffe6f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* PAGE CONTAINER */
    .page {
      display: none;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .active {
      display: flex;
    }

    /* PIXEL LETTER */
    .letter {
      width: 220px;
      height: 160px;
      background: #ffb6d9;
      border: 6px solid #ff69b4;
      box-shadow: 0 0 0 6px white;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease;
    }

    .letter:hover {
      transform: scale(1.05);
    }

    /* LETTER FLAP */
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: #ff87c5;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transition: 0.5s;
    }

    /* TEXT ON FRONT */
    .to-text {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
      font-size: 20px;
      color: white;
      font-weight: bold;
    }

    /* OPEN LETTER STATE */
    .opened .flap {
      transform: rotateX(180deg);
      transform-origin: top;
    }

    /* MESSAGE BOX */
    .message-box {
      display: none;
      margin-top: 30px;
      width: 320px;
      padding: 20px;
      background: white;
      border: 4px solid #ff69b4;
      border-radius: 15px;
      text-align: center;
      font-size: 18px;
      color: #ff4fa3;
    }

    /* NEXT BUTTON */
    .next-btn {
      display: none;
      position: absolute;
      bottom: 40px;
      padding: 14px 40px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: #ff69b4;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .next-btn:hover {
      background: #ff3c9e;
    }
  </style>
</head>

<body>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">

    <!-- Letter -->
    <div class="letter" id="letter">
      <div class="flap"></div>
      <div class="to-text">To Trinh 💌</div>
    </div>

    <!-- Message -->
    <div class="message-box" id="messageBox">
      <!-- Leave blank for now -->
      Your message will go here 💗
    </div>

    <!-- Next Button -->
    <button class="next-btn" id="nextBtn">NEXT ➜</button>
  </div>

  <!-- PAGE 2 (Blank Placeholder) -->
  <div class="page" id="page2">
    <h1 style="color:#ff4fa3;">Page 2 (Blank for now)</h1>
  </div>


  <script>
    const letter = document.getElementById("letter");
    const messageBox = document.getElementById("messageBox");
    const nextBtn = document.getElementById("nextBtn");

    let opened = false;

    // Click to open letter
    letter.addEventListener("click", () => {
      if (!opened) {
        opened = true;
        letter.classList.add("opened");

        // Show message + next button
        messageBox.style.display = "block";
        nextBtn.style.display = "block";
      }
    });

    // Next button moves to Page 2
    nextBtn.addEventListener("click", () => {
      document.getElementById("page1").classList.remove("active");
      document.getElementById("page2").classList.add("active");
    });
  </script>

</body>
</html>
