<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine Website</title>

  <style>
    body {
      margin: 0;
      font-family: "Courier New", monospace;
      background: #ffe6f2;
      height: 100vh;
      overflow: hidden;
    }

    /* PAGE SYSTEM */
    .page {
      display: none;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      position: relative;
    }

    .active {
      display: flex;
    }

    /* ---------------- PAGE 1 LETTER ---------------- */

    .letter {
      width: 220px;
      height: 160px;
      background: #ffb6d9;
      border: 6px solid #ff69b4;
      box-shadow: 0 0 0 6px white;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease;
    }

    .letter:hover {
      transform: scale(1.05);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: #ff87c5;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transition: 0.5s;
    }

    .to-text {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
      font-size: 20px;
      color: white;
      font-weight: bold;
    }

    .opened .flap {
      transform: rotateX(180deg);
      transform-origin: top;
    }

    .message-box {
      display: none;
      margin-top: 30px;
      width: 320px;
      padding: 20px;
      background: white;
      border: 4px solid #ff69b4;
      border-radius: 15px;
      font-size: 18px;
      color: #ff4fa3;
    }

    .next-btn {
      display: none;
      position: absolute;
      bottom: 40px;
      padding: 14px 40px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: #ff69b4;
      color: white;
      cursor: pointer;
    }

    .next-btn:hover {
      background: #ff3c9e;
    }

    /* ---------------- PAGE 2 VALENTINE QUESTION ---------------- */

    h1 {
      color: #ff4fa3;
      font-size: 42px;
      margin-bottom: 20px;
    }

    .capy-img {
      width: 280px;
      border-radius: 20px;
      border: 4px solid #ff69b4;
      background: white;
      padding: 10px;
      margin-bottom: 25px;
    }

    .btn-container {
      display: flex;
      gap: 30px;
      margin-top: 10px;
      position: relative;
    }

    button {
      padding: 14px 35px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    .yes-btn {
      background: #ff69b4;
      color: white;
    }

    .yes-btn:hover {
      background: #ff3c9e;
    }

    .no-btn {
      background: white;
      border: 3px solid #ff69b4;
      color: #ff4fa3;
      position: absolute;
    }

    /* Message under image */
    .sad-message {
      margin-top: 20px;
      font-size: 18px;
      color: #ff4fa3;
      min-height: 30px;
    }
  </style>
</head>

<body>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">
    <div class="letter" id="letter">
      <div class="flap"></div>
      <div class="to-text">To Trinh 💌</div>
    </div>

    <div class="message-box" id="messageBox">
      Your message will go here 💗
    </div>

    <button class="next-btn" id="nextBtn">NEXT ➜</button>
  </div>

  <!-- PAGE 2 -->
  <div class="page" id="page2">
    <h1>Will you be my Valentine’s? 💘</h1>

    <img
      src="images/cute-illustration-of-capybara-animals-perfect-for-valentine-s-day-cards-invitations-capybara-with-hearts-in-hands-vector.jpg"
      class="capy-img"
      alt="Capybara Valentine"
    />

    <div class="btn-container" id="btnContainer">
      <button class="yes-btn" id="yesBtn">Yes 💖</button>
      <button class="no-btn" id="noBtn">No 💔</button>
    </div>

    <div class="sad-message" id="sadMessage"></div>
  </div>

  <!-- PAGE 3 (Blank Placeholder) -->
  <div class="page" id="page3">
    <h1 style="color:#ff4fa3;">Page 3 (Blank for now 💗)</h1>
  </div>


  <script>
    /* ---------- PAGE 1 LETTER ---------- */
    const letter = document.getElementById("letter");
    const messageBox = document.getElementById("messageBox");
    const nextBtn = document.getElementById("nextBtn");

    let opened = false;

    letter.addEventListener("click", () => {
      if (!opened) {
        opened = true;
        letter.classList.add("opened");
        messageBox.style.display = "block";
        nextBtn.style.display = "block";
      }
    });

    nextBtn.addEventListener("click", () => {
      document.getElementById("page1").classList.remove("active");
      document.getElementById("page2").classList.add("active");
    });


    /* ---------- PAGE 2 BUTTONS ---------- */
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const sadMessage = document.getElementById("sadMessage");

    const messages = [
      "I think you clicked the wrong one 😭",
      "You’re breaking my heart… 💔",
      "No isn’t an option bestie 😤",
      "Try again... but choose wisely 👀",
      "Capybara is disappointed 🥺",
      "That button does NOT work 😅",
      "Please say yes 💖"
    ];

    let msgIndex = 0;

    // Move NO button randomly
    function moveNoButton() {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 120 - 60;

      noBtn.style.transform = `translate(${x}px, ${y}px)`;

      // Change message
      sadMessage.textContent = messages[msgIndex];
      msgIndex = (msgIndex + 1) % messages.length;
    }

    // Trigger movement when hovering or trying to click
    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);

    // YES button goes to Page 3
    yesBtn.addEventListener("click", () => {
      document.getElementById("page2").classList.remove("active");
      document.getElementById("page3").classList.add("active");
    });
  </script>

</body>
</html>
