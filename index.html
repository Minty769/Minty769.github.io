<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine</title>

  <style>
    body {
      margin: 0;
      font-family: "Courier New", monospace;
      background: radial-gradient(circle, #ffb6c1, #ff003c);
      height: 100vh;
      overflow: hidden;
    }

    /* MOBILE FRIENDLY CENTERING */
    .page {
      display: none;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      position: relative;
      padding: 20px;
      box-sizing: border-box;
    }

    .active {
      display: flex;
    }

    h1 {
      color: white;
      font-size: clamp(28px, 6vw, 46px);
      text-shadow: 0 0 12px #ff003c;
      margin-bottom: 20px;
    }

    /* ---------------- PAGE 1 LETTER ---------------- */

    .letter {
      width: min(260px, 85vw);
      height: 180px;
      background: #ff4d6d;
      border: 6px solid #ff003c;
      box-shadow: 0 0 0 6px white, 0 0 30px pink;
      border-radius: 20px;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease;
    }

    .letter:hover {
      transform: scale(1.08);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 55%;
      background: #ff85a1;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transition: 0.6s;
    }

    .seal {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 34px;
    }

    .to-text {
      position: absolute;
      bottom: 22px;
      width: 100%;
      text-align: center;
      font-size: 22px;
      color: white;
      font-weight: bold;
      text-shadow: 0 0 10px #ffd1dc;
    }

    .opened .flap {
      transform: rotateX(180deg);
      transform-origin: top;
    }

    .message-box {
      display: none;
      margin-top: 30px;
      width: min(340px, 90vw);
      padding: 20px;
      background: white;
      border: 4px solid #ff003c;
      border-radius: 18px;
      font-size: 18px;
      color: #ff003c;
      line-height: 1.4;
    }

    .next-btn {
      display: none;
      margin-top: 25px;
      padding: 14px 45px;
      font-size: 18px;
      border: none;
      border-radius: 35px;
      background: #ff003c;
      color: white;
      cursor: pointer;
    }

    /* ---------------- PAGE 2 ---------------- */

    .capy-img {
      width: min(290px, 85vw);
      border-radius: 22px;
      border: 4px solid white;
      padding: 10px;
      background: white;
      margin-bottom: 20px;
    }

    .btn-container {
      display: flex;
      gap: 25px;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    button {
      padding: 14px 35px;
      font-size: 18px;
      border-radius: 35px;
      cursor: pointer;
      font-weight: bold;
      border: none;
    }

    .yes-btn {
      background: #ff003c;
      color: white;
    }
