<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine 💘</title>

  <style>
    body {
      margin: 0;
      font-family: "Courier New", monospace;
      background: radial-gradient(circle, #ffd1dc, #ff4d6d);
      height: 100vh;
      overflow: hidden;
    }

    /* PAGE SYSTEM */
    .page {
      display: none;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      position: relative;
    }

    .active {
      display: flex;
    }

    /* ---------------- PAGE 1 LETTER ---------------- */

    .letter {
      width: 240px;
      height: 170px;
      background: #ff5c8a;
      border: 6px solid #ff1e56;
      box-shadow: 0 0 0 6px white, 0 0 25px pink;
      border-radius: 18px;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease;
    }

    .letter:hover {
      transform: scale(1.08);
    }

    /* Envelope flap */
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 55%;
      background: #ff85a1;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transition: 0.6s;
    }

    /* Cute heart seal */
    .seal {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
    }

    /* Text */
    .to-text {
      position: absolute;
      bottom: 22px;
      width: 100%;
      text-align: center;
      font-size: 22px;
      color: white;
      font-weight: bold;
      text-shadow: 0 0 8px #ffb3c6;
    }

    /* OPEN LETTER */
    .opened .flap {
      transform: rotateX(180deg);
      transform-origin: top;
    }

    .message-box {
      display: none;
      margin-top: 35px;
      width: 340px;
      padding: 22px;
      background: white;
      border: 4px solid #ff1e56;
      border-radius: 18px;
      font-size: 18px;
      color: #ff1e56;
      box-shadow: 0 0 15px rgba(255,0,90,0.4);
    }

    .next-btn {
      display: none;
      position: absolute;
      bottom: 45px;
      padding: 14px 45px;
      font-size: 18px;
      border: none;
      border-radius: 35px;
      background: #ff1e56;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255,0,90,0.6);
    }

    .next-btn:hover {
      background: #ff003c;
    }

    /* ---------------- PAGE 2 QUESTION ---------------- */

    h1 {
      color: white;
      font-size: 46px;
      text-shadow: 0 0 12px #ff1e56;
      margin-bottom: 25px;
    }

    .capy-img {
      width: 290px;
      border-radius: 22px;
      border: 4px solid white;
      background: white;
      padding: 12px;
      margin-bottom: 25px;
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }

    .btn-container {
      display: flex;
      gap: 35px;
      margin-top: 10px;
    }

    button {
      padding: 14px 38px;
      font-size: 18px;
      border: none;
      border-radius: 35px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    .yes-btn {
      background: #ff1e56;
      color: white;
      box-shadow: 0 0 12px rgba(255,0,90,0.6);
    }

    .yes-btn:hover {
      background: #ff003c;
    }

    .no-btn {
      background: white;
      border: 3px solid #ff1e56;
      color: #ff1e56;
      position: relative;
    }

    .sad-message {
      margin-top: 22px;
      font-size: 20px;
      color: white;
      min-height: 35px;
      text-shadow: 0 0 8px #ff003c;
    }

    /* ---------------- HEARTS FLOATING ---------------- */

    .heart {
      position: absolute;
      font-size: 28px;
      animation: floatUp 2.5s ease forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-180px) scale(1.7);
      }
    }
  </style>
</head>

<body>

  <!-- 🎵 MUSIC (plays only on Page 3) -->
  <audio id="bgMusic" loop>
    <source src="music/romantic.mp3" type="audio/mpeg">
  </audio>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">

    <div class="letter" id="letter">
      <div class="flap"></div>
      <div class="seal">💖</div>
      <div class="to-text">To Trinh 💌</div>
    </div>

    <div class="message-box" id="messageBox">
      (Your message goes here 💗)
    </div>

    <button class="next-btn" id="nextBtn">NEXT ➜</button>
  </div>

  <!-- PAGE 2 -->
  <div class="page" id="page2">
    <h1>Will you be my Valentine’s? 💘</h1>

    <img
      src="images/cute-illustration-of-capybara-animals-perfect-for-valentine-s-day-cards-invitations-capybara-with-hearts-in-hands-vector.jpg"
      class="capy-img"
      alt="Capybara Valentine"
    />

    <div class="btn-container">
      <button class="yes-btn" id="yesBtn">Yes 💖</button>
      <button class="no-btn" id="noBtn">No 💔</button>
    </div>

    <div class="sad-message" id="sadMessage"></div>
  </div>

  <!-- PAGE 3 -->
  <div class="page" id="page3">
    <h1>Thank you so much</h1>

    <img src="images/happy.gif"
         width="260"
         style="margin-top:20px; border-radius:22px; box-shadow:0 0 20px white;">

    <p style="color:white; font-size:22px; margin-top:18px; text-shadow:0 0 10px #ff003c;">
      We’ll celebrate properly when you’re back
    </p>
  </div>


  <script>
    /* PAGE 1 */
    const letter = document.getElementById("letter");
    const messageBox = document.getElementById("messageBox");
    const nextBtn = document.getElementById("nextBtn");

    let opened = false;

    letter.addEventListener("click", () => {
      if (!opened) {
        opened = true;
        letter.classList.add("opened");
        messageBox.style.display = "block";
        nextBtn.style.display = "block";
      }
    });

    nextBtn.addEventListener("click", () => {
      pageSwitch("page1", "page2");
    });

    /* PAGE SWITCH HELPER */
    function pageSwitch(from, to) {
      document.getElementById(from).classList.remove("active");
      document.getElementById(to).classList.add("active");
    }

    /* PAGE 2 BUTTONS */
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const sadMessage = document.getElementById("sadMessage");

    const messages = [
      "I think you clicked the wrong one 😭",
      "You’re breaking my heart… 💔",
      "No isn’t an option bestie 😤",
      "Capybara is disappointed 🥺",
      "Pleaseeeee say yes 💖",
      "That button doesn’t work 😅",
      "Try again… but choose wisely 👀"
    ];

    let msgIndex = 0;
    let speed = 1;

    function moveNoButton() {
      speed += 0.15;

      const x = (Math.random() * 200 - 100) * speed;
      const y = (Math.random() * 120 - 60) * speed;

      noBtn.style.transform = `translate(${x}px, ${y}px)`;

      sadMessage.textContent = messages[msgIndex];
      msgIndex = (msgIndex + 1) % messages.length;
    }

    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);

    /* PAGE 3 MUSIC + HEARTS */
    const bgMusic = document.getElementById("bgMusic");

    function startHeartRain() {
      setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.textContent = "❤️";

        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.top = window.innerHeight + "px";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 2500);
      }, 600);
    }

    yesBtn.addEventListener("click", () => {
      pageSwitch("page2", "page3");

      /* Start music softly */
      bgMusic.volume = 0.05;
      bgMusic.play();

      /* Fade volume up slowly */
      let vol = 0.05;
      let fade = setInterval(() => {
        if (vol < 0.4) {
          vol += 0.01;
          bgMusic.volume = vol;
        } else {
          clearInterval(fade);
        }
      }, 200);

      /* Hearts start */
      startHeartRain();
    });
  </script>

</body>
</html>
